# ==============================================================================
# Cấu hình Nginx Reverse Proxy cho: https://play.edunow.today
# Hỗ trợ WebSockets (Socket.IO), HTTP/2, SSL và bảo mật cookie
# ==============================================================================

# 1. Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name play.edunow.today;

    # Let's Encrypt Webroot challenge
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/play.edunow.today;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.edunow.today;

    # Đường dẫn SSL Cert (aaPanel hoặc Let's Encrypt Certbot)
    ssl_certificate /www/server/panel/vhost/cert/play.edunow.today/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/play.edunow.today/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Thư mục gốc website (dùng cho challenge hoặc backup tĩnh)
    root /www/wwwroot/play.edunow.today;
    index index.html;

    # Client body limit
    client_max_body_size 10M;

    # WebSocket Socket.IO endpoint
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3027/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # API và Web Application
    location / {
        proxy_pass http://127.0.0.1:3027;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Tắt log các file favicon và robots nếu không cần thiết
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

# Map for WebSocket connection upgrade (đặt ở khối http nếu dùng custom nginx.conf, hoặc có sẵn trong aaPanel)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
