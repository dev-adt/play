services:
  db:
    image: postgres:16-alpine
    container_name: tienlen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tienlen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tienlen_db_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tienlen_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tienlen} -d ${POSTGRES_DB:-tienlen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienlen_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienlen_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-https://play.edunow.today}
      SESSION_SECRET: ${SESSION_SECRET:-changeme_super_secret_session_jwt_key_2026}
      DATABASE_URL: postgres://${POSTGRES_USER:-tienlen}:${POSTGRES_PASSWORD:-tienlen_db_secret_pass}@db:5432/${POSTGRES_DB:-tienlen_db}
      CLIENT_DIST_PATH: /app/packages/client/dist
    ports:
      # Only bind to loopback on host - exposed to outside only via Nginx reverse proxy
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tienlen_network

networks:
  tienlen_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
